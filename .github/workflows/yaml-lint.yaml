name: YAML lint

on:
  push:
    paths:
      - "**/*.yaml"
      - "**/*.yml"
      - ".yamllint.yaml"
      - ".github/workflows/yaml-lint.yaml"
  pull_request:
    paths:
      - "**/*.yaml"
      - "**/*.yml"
      - ".yamllint.yaml"
      - ".github/workflows/yaml-lint.yaml"

concurrency:
  group: yaml-lint-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  yamllint:
    name: YAML syntax and style
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yamllint
        run: python -m pip install yamllint==1.38.0

      - name: Run yamllint
        run: yamllint --strict -c .yamllint.yaml .
