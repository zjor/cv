name: Actions lint

on:
  push:
    paths:
      - ".github/**"
  pull_request:
    paths:
      - ".github/**"

concurrency:
  group: actions-lint-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Run actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color
